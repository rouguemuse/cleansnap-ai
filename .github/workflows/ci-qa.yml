name: CleanSnap Studio — CI / QA & Scheduled Production Health Audit

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
  schedule:
    # Runs automated QA, build, and live production endpoint health checks daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-qa:
    name: Frontend Lint, Unit QA & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Static Linter (oxlint)
        run: npm run lint

      - name: Run Segmentation, Mask & Stripe HMAC Unit Tests
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Verify Production Dist Output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          ls -lh dist/assets/

  python-asset-and-backend-qa:
    name: Cutout Alpha Integrity & Backend SQLite QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QA Dependencies
        run: pip install --upgrade pip pillow numpy

      - name: Run Asset Alpha & Backend Registry QA Suite
        run: python backend/tests/test_cutout_and_backend_qa.py

  live-production-smoke-qa:
    name: Live Production & Stripe HMAC Endpoint Smoke Audit
    runs-on: ubuntu-latest
    needs: [frontend-qa]
    steps:
      - name: Verify Live App, Manifest, Privacy Policy & Server-Gated Endpoints
        run: |
          node -e '
          (async () => {
            const base = "https://bold-oppenheimer.vercel.app";
            const rHome = await fetch(base + "/");
            if (rHome.status !== 200) throw new Error("Homepage returned " + rHome.status);

            const rMan = await fetch(base + "/manifest.webmanifest");
            if (rMan.status !== 200) throw new Error("Manifest returned " + rMan.status);

            const rPriv = await fetch(base + "/privacy.html");
            if (rPriv.status !== 200) throw new Error("Privacy policy returned " + rPriv.status);

            const rLocked = await fetch(base + "/api/pro-assets?style=auto_obsidian_cyclorama");
            if (rLocked.status !== 403) throw new Error("Expected 403 on unauthenticated pro-assets, got " + rLocked.status);

            console.log("All live production smoke checks passed!");
          })();
          '
